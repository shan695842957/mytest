<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="headerGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0c9454" />
      <stop offset="1" stop-color="#087248" />
    </linearGradient>
    <style>
      .title { font: 600 36px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #fff; }
      .subtitle { font: 20px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #d9ffe8; }
      .nav { font: 16px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #0f2d3a; font-weight: 600; }
      .label { font: 18px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #5d6874; }
      .value { font: 26px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #0d9c5d; font-weight: 600; }
      .card-title { font: 22px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #12202c; font-weight: 600; }
      .table-head { font: 18px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #0f2a3d; font-weight: 600; }
      .table-row { font: 16px 'DejaVu Sans', 'Segoe UI', sans-serif; fill: #3c4a57; }
      .badge-ok { fill: #51d19c; }
      .badge-warn { fill: #ffb347; }
      .badge-danger { fill: #ff6b6b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#f4f7fb" />

  <!-- Header -->
  <rect width="1600" height="90" fill="url(#headerGrad)" />
  <text class="title" x="40" y="55">PCS Energy Dispatch · Real-time Panel</text>
  <text class="subtitle" x="40" y="80">Site: East-West Data Hub D05 | Mode: Grid Charging + FRT Guard</text>
  <text class="subtitle" x="1080" y="60">Control Center Wall · 2025-12-08 15:42</text>

  <!-- Single-page quick filters (no side menu) -->
  <g>
    <rect x="60" y="110" width="1480" height="640" rx="28" fill="#fff" stroke="#dbe4ef" stroke-width="2" />
    <rect x="100" y="130" width="140" height="38" rx="19" fill="#e1f4ea" />
    <rect x="250" y="130" width="160" height="38" rx="19" fill="#f0f3f7" />
    <rect x="420" y="130" width="170" height="38" rx="19" fill="#f0f3f7" />
    <rect x="600" y="130" width="190" height="38" rx="19" fill="#f0f3f7" />
    <text class="nav" x="130" y="155">Topology View</text>
    <text class="nav" x="280" y="155">Realtime Data</text>
    <text class="nav" x="455" y="155">Diagnostics</text>
    <text class="nav" x="635" y="155">Command Timeline</text>
  </g>

  <text class="card-title" x="100" y="210">Grid → PCS → Battery | Live Power Path</text>
  <text class="label" x="100" y="240">Power flow: grid sends energy to battery banks (negative real power = charging) · RCU strategy: phase-locked VSG</text>

  <!-- Topology line -->
  <g stroke="#1f2d3a" stroke-width="6" fill="none">
    <path d="M220 300 H440" />
    <polygon points="250,250 280,290 280,360 250,320" fill="#1f2d3a" />
    <path d="M440 300 L620 220" />
    <rect x="620" y="180" width="130" height="140" rx="6" />
    <path d="M750 240 H880" />
    <rect x="890" y="180" width="90" height="140" rx="6" />
    <rect x="1010" y="140" width="190" height="220" rx="12" />
    <rect x="1035" y="180" width="70" height="140" rx="6" fill="#0a7d4a" />
    <path d="M1200 240 H1360" />
    <polygon points="1360,220 1360,260 1400,240" fill="#0a7d4a" stroke="none" />
  </g>

  <!-- Measurement labels -->
  <g class="label">
    <text x="190" y="280">Grid AB Voltage</text>
    <text class="value" x="190" y="310">10.6 kV</text>
    <text x="360" y="280">Phase Current</text>
    <text class="value" x="360" y="310">312 A</text>
    <text x="620" y="360">DC Bus (P-O)</text>
    <text class="value" x="620" y="390">1188 V</text>
    <text x="890" y="360">Filter Reactor THD</text>
    <text class="value" x="890" y="390">3.1 %</text>
    <text x="1020" y="200">Battery SOC</text>
    <text class="value" x="1020" y="230">86 %</text>
    <text x="1230" y="300">Grid-side Power</text>
    <text class="value" x="1230" y="330">-2.3 MW</text>
  </g>

  <!-- Info cards -->
  <g>
    <rect x="190" y="420" width="320" height="180" rx="18" fill="#f6fafc" stroke="#dbe4ef" />
    <text class="card-title" x="210" y="460">AC Input</text>
    <text class="label" x="210" y="495">Frequency</text>
    <text class="value" x="320" y="495">50.02 Hz</text>
    <text class="label" x="210" y="535">Power Factor</text>
    <text class="value" x="320" y="535">0.985</text>
    <text class="label" x="210" y="575">Phase Imbalance</text>
    <text class="value" x="390" y="575">0.7 %</text>
  </g>
  <g>
    <rect x="540" y="420" width="320" height="180" rx="18" fill="#f6fafc" stroke="#dbe4ef" />
    <text class="card-title" x="560" y="460">DC Bus</text>
    <text class="label" x="560" y="495">P-O Voltage</text>
    <text class="value" x="700" y="495">1185 V</text>
    <text class="label" x="560" y="535">O-N Voltage</text>
    <text class="value" x="700" y="535">1162 V</text>
    <text class="label" x="560" y="575">Total Power</text>
    <text class="value" x="700" y="575">2.36 MW</text>
  </g>
  <g>
    <rect x="890" y="420" width="320" height="180" rx="18" fill="#f6fafc" stroke="#dbe4ef" />
    <text class="card-title" x="910" y="460">Battery Cluster</text>
    <text class="label" x="910" y="495">Temperature</text>
    <text class="value" x="1020" y="495">27.6 °C</text>
    <text class="label" x="910" y="535">Available Racks</text>
    <text class="value" x="1050" y="535">24 / 24</text>
    <text class="label" x="910" y="575">Balancing</text>
    <text class="value" x="1050" y="575">In Progress</text>
  </g>

  <!-- Mode badge -->
  <g>
    <rect x="1250" y="420" width="260" height="180" rx="18" fill="#0f2d3a" />
    <text class="title" x="1280" y="470">VSG Grid Mode</text>
    <text class="subtitle" x="1280" y="505">PLL: Locked · Standby: Black Start</text>
    <rect x="1280" y="520" width="200" height="36" rx="18" class="badge-ok" />
    <text class="nav" x="1295" y="545" fill="#0f2d3a">Dispatch Setpoint: 2.0 MW charge</text>
  </g>

  <!-- Alert table -->
  <rect x="60" y="780" width="1480" height="90" rx="18" fill="#fff" stroke="#dbe4ef" />
  <text class="table-head" x="90" y="810">Time</text>
  <text class="table-head" x="330" y="810">Source</text>
  <text class="table-head" x="540" y="810">Level</text>
  <text class="table-head" x="720" y="810">Description</text>
  <g class="table-row">
    <text x="90" y="845">15:40:12</text>
    <text x="330" y="845">CPU-A1</text>
    <text x="540" y="845" fill="#ffb347">Warning</text>
    <text x="720" y="845">Bus delta 32 V, auto balance engaged</text>

    <text x="90" y="875">15:38:06</text>
    <text x="330" y="875">Battery-C</text>
    <text x="540" y="875" fill="#ff6b6b">Critical</text>
    <text x="720" y="875">Rack #12 temp ramp 5 °C/min, water loop boost</text>
  </g>
</svg>
