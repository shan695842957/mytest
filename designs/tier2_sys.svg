<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F5F5F5"/>
  
  <!-- Tabs -->
  <g id="tabs">
    <rect x="40" y="20" width="100" height="50" rx="8" fill="#2E7D32"/>
    <text x="90" y="50" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">SYS</text>
    <rect x="150" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="200" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BCU</text>
    <rect x="260" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="310" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BMU</text>
    <rect x="370" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="420" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">EVT</text>
  </g>
  
  <!-- Title -->
  <text x="40" y="140" fill="#212121" font-size="48" font-family="Arial" font-weight="bold">Cluster Overview</text>
  <text x="40" y="180" fill="#757575" font-size="24" font-family="Arial">Tier 2: Cluster Basic Information and Pack Status</text>
  <line x1="40" y1="200" x2="1880" y2="200" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Cluster Basic Information -->
  <text x="40" y="250" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Cluster Basic Information</text>
  
  <!-- Status indicators -->
  <text x="40" y="300" fill="#757575" font-size="18" font-family="Arial">Alarm Status</text>
  <rect x="40" y="325" width="160" height="40" rx="4" fill="#F44336"/>
  <text x="120" y="350" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">Fault</text>
  
  <text x="40" y="380" fill="#757575" font-size="18" font-family="Arial">Operation Status</text>
  <rect x="40" y="405" width="160" height="40" rx="4" fill="#FF9800"/>
  <text x="120" y="430" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">Local</text>
  
  <!-- Metrics -->
  <rect x="240" y="300" width="200" height="100" rx="8" fill="#FFFFFF"/>
  <text x="250" y="320" fill="#757575" font-size="18" font-family="Arial">Cluster Voltage</text>
  <text x="340" y="360" text-anchor="middle" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">1250.5 V</text>
  
  <rect x="460" y="300" width="200" height="100" rx="8" fill="#FFFFFF"/>
  <text x="470" y="320" fill="#757575" font-size="18" font-family="Arial">Cluster Current</text>
  <text x="560" y="360" text-anchor="middle" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">1320.0 A</text>
  
  <rect x="680" y="300" width="200" height="100" rx="8" fill="#FFFFFF"/>
  <text x="690" y="320" fill="#757575" font-size="18" font-family="Arial">Power</text>
  <text x="780" y="360" text-anchor="middle" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">1650.6 kW</text>
  
  <text x="900" y="300" fill="#757575" font-size="18" font-family="Arial">Breaker Status</text>
  <rect x="900" y="325" width="200" height="40" rx="4" fill="#4CAF50"/>
  <text x="1000" y="350" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">Closed</text>
  
  <!-- Additional indicators -->
  <text x="40" y="420" fill="#757575" font-size="18" font-family="Arial">SOC</text>
  <text x="40" y="450" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">12.7%</text>
  
  <text x="200" y="420" fill="#757575" font-size="18" font-family="Arial">SOE</text>
  <text x="200" y="450" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">0.0%</text>
  
  <text x="360" y="420" fill="#757575" font-size="18" font-family="Arial">SOH</text>
  <text x="360" y="450" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">93%</text>
  
  <text x="520" y="420" fill="#757575" font-size="18" font-family="Arial">SOS</text>
  <text x="520" y="450" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">50.0%</text>
  
  <text x="680" y="420" fill="#757575" font-size="18" font-family="Arial">Consistency</text>
  <text x="680" y="450" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">91%</text>
  
  <text x="900" y="420" fill="#757575" font-size="18" font-family="Arial">Insulation</text>
  <text x="900" y="450" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">980kΩ</text>
  
  <line x1="40" y1="500" x2="1880" y2="500" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Breaker Control -->
  <text x="40" y="530" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Breaker Control</text>
  <rect x="40" y="560" width="260" height="60" rx="8" fill="#4CAF50"/>
  <text x="170" y="595" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">Close Breaker</text>
  <rect x="340" y="560" width="260" height="60" rx="8" fill="#F44336"/>
  <text x="470" y="595" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">Open Breaker</text>
  
  <line x1="40" y1="650" x2="1880" y2="650" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Pack Status -->
  <text x="40" y="680" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Pack Status (Series Connection)</text>
  
  <!-- Pack list (simplified for SVG) -->
  <g id="packs">
    <rect x="40" y="720" width="1800" height="70" rx="6" fill="#FFFFFF"/>
    <text x="60" y="750" fill="#212121" font-size="20" font-family="Arial">Pack 01</text>
    <text x="220" y="750" fill="#212121" font-size="18" font-family="Arial">SOC: 93.0%</text>
    <text x="370" y="750" fill="#212121" font-size="18" font-family="Arial">Voltage: 125.0V</text>
    <text x="520" y="750" fill="#212121" font-size="18" font-family="Arial">Current: 110.0A</text>
    <rect x="720" y="735" width="400" height="20" rx="4" fill="#BDBDBD"/>
    <rect x="720" y="735" width="372" height="20" rx="4" fill="#4CAF50"/>
    
    <line x1="140" y1="790" x2="140" y2="805" stroke="#1976D2" stroke-width="3"/>
    <text x="150" y="800" fill="#1976D2" font-size="14" font-family="Arial">Series</text>
    
    <rect x="40" y="805" width="1800" height="70" rx="6" fill="#FFFFFF"/>
    <text x="60" y="835" fill="#212121" font-size="20" font-family="Arial">Pack 02</text>
    <text x="220" y="835" fill="#212121" font-size="18" font-family="Arial">SOC: 92.3%</text>
    <text x="370" y="835" fill="#212121" font-size="18" font-family="Arial">Voltage: 124.9V</text>
    <text x="520" y="835" fill="#212121" font-size="18" font-family="Arial">Current: 110.0A</text>
    <rect x="720" y="820" width="400" height="20" rx="4" fill="#BDBDBD"/>
    <rect x="720" y="820" width="369" height="20" rx="4" fill="#4CAF50"/>
  </g>
</svg>