<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F5F5F5"/>
  
  <!-- Tabs -->
  <g id="tabs">
    <rect x="40" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="90" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">SYS</text>
    <rect x="150" y="20" width="100" height="50" rx="8" fill="#2E7D32"/>
    <text x="200" y="50" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">BAU</text>
    <rect x="260" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="310" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BCU</text>
    <rect x="370" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="420" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BMU</text>
    <rect x="470" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="520" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">EVT</text>
  </g>
  
  <!-- Title -->
  <text x="40" y="140" fill="#212121" font-size="48" font-family="Arial" font-weight="bold">Stack Data</text>
  <text x="40" y="180" fill="#757575" font-size="24" font-family="Arial">Tier 3: Telemetry and Telecontrol Information</text>
  <line x1="40" y1="200" x2="1880" y2="200" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Telemetry Data -->
  <text x="40" y="250" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Telemetry Data</text>
  
  <!-- Key metrics (simplified) -->
  <rect x="40" y="270" width="200" height="100" rx="8" fill="#FFFFFF"/>
  <text x="50" y="290" fill="#757575" font-size="18" font-family="Arial">SOC</text>
  <text x="140" y="330" text-anchor="middle" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">12.7 %</text>
  
  <line x1="40" y1="400" x2="1880" y2="400" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Telecontrol Data -->
  <text x="40" y="430" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Telecontrol Data (Alarm Status)</text>
  
  <!-- Alarm chips (simplified) -->
  <rect x="40" y="460" width="200" height="32" rx="16" fill="#4CAF50"/>
  <text x="140" y="480" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial">Total Overvoltage</text>
  
  <rect x="260" y="460" width="200" height="32" rx="16" fill="#F44336"/>
  <text x="360" y="480" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial">Insulation Failure</text>
  
  <line x1="40" y1="520" x2="1880" y2="520" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Control Commands -->
  <text x="40" y="550" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Control Commands</text>
  <rect x="40" y="580" width="200" height="50" rx="8" fill="#F44336"/>
  <text x="140" y="610" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">Fault Reset</text>
</svg>