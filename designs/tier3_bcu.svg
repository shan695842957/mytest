<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F5F5F5"/>
  
  <!-- Tabs -->
  <g id="tabs">
    <rect x="40" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="90" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">SYS</text>
    <rect x="150" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="200" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BAU</text>
    <rect x="260" y="20" width="100" height="50" rx="8" fill="#2E7D32"/>
    <text x="310" y="50" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">BCU</text>
    <rect x="370" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="420" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BMU</text>
    <rect x="470" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="520" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">EVT</text>
  </g>
  
  <!-- Title -->
  <text x="40" y="140" fill="#212121" font-size="48" font-family="Arial" font-weight="bold">Cluster Data</text>
  <text x="40" y="180" fill="#757575" font-size="24" font-family="Arial">Tier 3: Cluster Telemetry and Telecontrol Information</text>
  <line x1="40" y1="200" x2="1880" y2="200" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Cluster selector -->
  <text x="40" y="250" fill="#212121" font-size="20" font-family="Arial">Cluster:</text>
  <rect x="120" y="235" width="100" height="30" rx="4" fill="#FFFFFF"/>
  <text x="170" y="255" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">C1</text>
  <text x="280" y="250" fill="#1976D2" font-size="18" font-family="Arial">Previous</text>
  <text x="380" y="250" fill="#1976D2" font-size="18" font-family="Arial">Next</text>
  
  <line x1="40" y1="290" x2="1880" y2="290" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Telemetry Data -->
  <text x="40" y="320" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Telemetry Data</text>
  
  <!-- Key metrics (simplified) -->
  <rect x="40" y="340" width="200" height="100" rx="8" fill="#FFFFFF"/>
  <text x="50" y="360" fill="#757575" font-size="18" font-family="Arial">SOC</text>
  <text x="140" y="400" text-anchor="middle" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">12.7 %</text>
  
  <line x1="40" y1="470" x2="1880" y2="470" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Telecontrol Data -->
  <text x="40" y="500" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Telecontrol Data (Alarm Status)</text>
  
  <!-- Alarm chips (simplified) -->
  <rect x="40" y="530" width="200" height="32" rx="16" fill="#4CAF50"/>
  <text x="140" y="550" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial">Total Overvoltage</text>
  
  <rect x="260" y="530" width="200" height="32" rx="16" fill="#F44336"/>
  <text x="360" y="550" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial">Insulation Failure</text>
</svg>