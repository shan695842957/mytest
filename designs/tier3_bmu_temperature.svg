<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F5F5F5"/>
  
  <!-- Tabs -->
  <g id="tabs">
    <rect x="40" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="90" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">SYS</text>
    <rect x="150" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="200" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BAU</text>
    <rect x="260" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="310" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BCU</text>
    <rect x="370" y="20" width="100" height="50" rx="8" fill="#2E7D32"/>
    <text x="420" y="50" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">BMU</text>
    <rect x="470" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="520" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">EVT</text>
  </g>
  
  <!-- Title -->
  <text x="40" y="140" fill="#212121" font-size="48" font-family="Arial" font-weight="bold">Temperature Points</text>
  <text x="40" y="180" fill="#757575" font-size="24" font-family="Arial">Tier 3: Temperature Monitoring Points (Not per cell)</text>
  <line x1="40" y1="200" x2="1880" y2="200" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Cluster and Pack selectors -->
  <text x="40" y="250" fill="#212121" font-size="20" font-family="Arial">Cluster:</text>
  <rect x="120" y="235" width="100" height="30" rx="4" fill="#FFFFFF"/>
  <text x="170" y="255" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">C1</text>
  <text x="280" y="250" fill="#1976D2" font-size="18" font-family="Arial">Previous</text>
  <text x="380" y="250" fill="#1976D2" font-size="18" font-family="Arial">Next</text>
  
  <text x="500" y="250" fill="#212121" font-size="20" font-family="Arial">Pack:</text>
  <rect x="580" y="235" width="100" height="30" rx="4" fill="#FFFFFF"/>
  <text x="630" y="255" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">P1</text>
  <text x="730" y="250" fill="#1976D2" font-size="18" font-family="Arial">Previous</text>
  <text x="830" y="250" fill="#1976D2" font-size="18" font-family="Arial">Next</text>
  
  <line x1="40" y1="280" x2="1880" y2="280" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Temperature points -->
  <text x="40" y="310" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">Temperature Points</text>
  
  <g id="temp_points">
    <rect x="40" y="330" width="200" height="60" rx="6" fill="#FFFFFF"/>
    <text x="50" y="350" fill="#212121" font-size="20" font-family="Arial">Temp Point 1</text>
    <text x="50" y="375" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">27.0 °C</text>
    <circle cx="220" cy="345" r="10" fill="#4CAF50"/>
    
    <rect x="260" y="330" width="200" height="60" rx="6" fill="#FFFFFF"/>
    <text x="270" y="350" fill="#212121" font-size="20" font-family="Arial">Temp Point 2</text>
    <text x="270" y="375" fill="#212121" font-size="32" font-family="Arial" font-weight="bold">27.6 °C</text>
    <circle cx="440" cy="345" r="10" fill="#4CAF50"/>
  </g>
</svg>