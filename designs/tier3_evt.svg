<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F5F5F5"/>
  
  <!-- Tabs -->
  <g id="tabs">
    <rect x="40" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="90" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">SYS</text>
    <rect x="150" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="200" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BAU</text>
    <rect x="260" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="310" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BCU</text>
    <rect x="370" y="20" width="100" height="50" rx="8" fill="#E0E0E0"/>
    <text x="420" y="50" text-anchor="middle" fill="#212121" font-size="20" font-family="Arial">BMU</text>
    <rect x="470" y="20" width="100" height="50" rx="8" fill="#2E7D32"/>
    <text x="520" y="50" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial">EVT</text>
  </g>
  
  <!-- Title -->
  <text x="40" y="140" fill="#212121" font-size="48" font-family="Arial" font-weight="bold">Event Log</text>
  <text x="40" y="180" fill="#757575" font-size="24" font-family="Arial">Tier 3: System Telecontrol Information</text>
  <line x1="40" y1="200" x2="1880" y2="200" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Table header -->
  <text x="40" y="250" fill="#757575" font-size="20" font-family="Arial">Time</text>
  <text x="300" y="250" fill="#757575" font-size="20" font-family="Arial">Category</text>
  <text x="600" y="250" fill="#757575" font-size="20" font-family="Arial">Details</text>
  <line x1="40" y1="260" x2="1880" y2="260" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- Event rows (simplified) -->
  <text x="40" y="290" fill="#212121" font-size="18" font-family="Arial">2025/11/22 08:13:29</text>
  <rect x="300" y="275" width="150" height="32" rx="16" fill="#F44336"/>
  <text x="375" y="295" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial">System Fault</text>
  <text x="600" y="290" fill="#212121" font-size="18" font-family="Arial">BEMU Communication Timeout</text>
  
  <text x="40" y="340" fill="#212121" font-size="18" font-family="Arial">2025/11/22 08:09:29</text>
  <rect x="300" y="325" width="150" height="32" rx="16" fill="#FF9800"/>
  <text x="375" y="345" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial">System Alarm</text>
  <text x="600" y="340" fill="#212121" font-size="18" font-family="Arial">BEMU Communication Timeout</text>
</svg>