<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 鲜艳的渐变 -->
    <linearGradient id="energyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- 金色中心 -->
    <radialGradient id="centerCore">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 中心能量核 - 更大更醒目 -->
  <circle cx="100" cy="100" r="25" fill="url(#centerCore)"/>
  <circle cx="100" cy="100" r="25" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
  
  <!-- 主能量圈 - 更粗更鲜艳 -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="url(#energyGradient)" stroke-width="12" opacity="1"/>
  
  <!-- 外圈 - 更粗 -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#energyGradient)" stroke-width="8" opacity="0.6"/>
  
  <!-- 4个主要节点 - 更大更醒目 -->
  <g>
    <!-- 上 - 蓝色 -->
    <circle cx="100" cy="20" r="16" fill="#3B82F6"/>
    <circle cx="100" cy="20" r="16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <line x1="100" y1="75" x2="100" y2="36" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
  
    <!-- 右 - 紫色 -->
    <circle cx="180" cy="100" r="16" fill="#8B5CF6"/>
    <circle cx="180" cy="100" r="16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <line x1="125" y1="100" x2="164" y2="100" stroke="#8B5CF6" stroke-width="8" stroke-linecap="round"/>
  
    <!-- 下 - 绿色 -->
    <circle cx="100" cy="180" r="16" fill="#10B981"/>
    <circle cx="100" cy="180" r="16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <line x1="100" y1="125" x2="100" y2="164" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  
    <!-- 左 - 青色 -->
    <circle cx="20" cy="100" r="16" fill="#06B6D4"/>
    <circle cx="20" cy="100" r="16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <line x1="75" y1="100" x2="36" y2="100" stroke="#06B6D4" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
